name: is373-ai-chat-local
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: chat
      POSTGRES_DB: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chat:${POSTGRES_PASSWORD}@db:5432/chat
      BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    logging: *logging
volumes:
  database:
