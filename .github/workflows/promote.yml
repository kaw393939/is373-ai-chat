name: Promote accepted QA release
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful main delivery run containing the accepted QA candidate
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: chat-release
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      actions: read
      contents: write
      packages: read
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Validate selected run identifier
        run: python3 -c 'import os,sys; sys.path.insert(0,"deploy"); from release_policy import run_id; run_id(os.environ["CANDIDATE_RUN"])'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: accepted-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify successful QA and unused release identity
        id: candidate
        run: python3 deploy/ci_release.py preflight candidate.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: test-evidence
          path: evidence
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: qa-evidence
          path: evidence
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Promote same accepted digest
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: python3 deploy/ssh_release.py promote production > production.json
      - name: Confirm public production identity and prepare release notes
        env:
          COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://firehose360.com/api/health > production-health.json
          python3 -c 'import json,os; h=json.load(open("production-health.json")); d=json.load(open("production.json")); assert h["status"] == "ok" and h["commit"] == os.environ["COMMIT"] and h["version"] == os.environ["RELEASE_VERSION"] and h["schema"] == d["schema"]'
          python3 deploy/ci_release.py notes candidate.json
      - name: Publish immutable semantic release and durable evidence
        env:
          COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          test -s evidence/sbom.json && test -s evidence/vulnerabilities.json && test -s evidence/qa-smoke.json
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" candidate.json qa-attestation.json production.json production-health.json atomic-commits.json evidence/*.json evidence/coverage.xml --target "$COMMIT" --title "Application $RELEASE_VERSION" --notes-file release-notes.md "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: production-promotion
          path: |
            production*.json
            release-notes.md
          retention-days: 90
