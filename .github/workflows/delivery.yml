name: Test, publish, preview
on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'frontend/**', 'tests/**', 'deploy/**', 'migrations/**', 'scripts/run-browser-lab.py', 'scripts/install-trivy.sh', 'pyproject.toml', 'uv.lock', 'Dockerfile', 'VERSION', '.dockerignore', 'compose.yaml', 'alembic.ini', '.github/workflows/delivery.yml', '.github/workflows/promote.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'chat-release' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.identity.outputs.version }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: chat_test
          POSTGRES_DB: chat_test
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U chat_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://chat_test:ci-only-password@127.0.0.1:5432/chat_test
      TEST_ALLOW_RESET: chat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install locked Python environment
        run: |
          python3 -m pip install uv==0.12.15
          uv sync --frozen --python 3.14.7
      - name: Validate authoritative application version
        id: identity
        run: echo "version=$(python3 deploy/ci_release.py version)" >> "$GITHUB_OUTPUT"
      - name: Lint and unit/integration coverage
        run: |
          uv run ruff check app tests deploy
          uv run ruff format --check app tests deploy migrations
          uv run pytest tests/deployment tests/operations tests/process/test_safety.py -q
          uv run ruff check scripts/backup-vault.py
          uv run pytest --cov --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
      - name: Check migration parity
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic check
      - name: Audit locked browser dependencies
        run: npm --prefix frontend audit --audit-level=high
      - name: Build the release once
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: docker build --build-arg COMMIT_SHA="$GITHUB_SHA" --build-arg APP_VERSION="$RELEASE_VERSION" -t chat:ci .
      - name: Migrate and seed an isolated browser database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U chat_test -d chat_test -c 'CREATE DATABASE browser_test'
          docker run --rm --network host -e DATABASE_URL=postgresql+asyncpg://chat_test:ci-only-password@127.0.0.1:5432/browser_test chat:ci alembic upgrade head
          docker run --rm --network host -e DATABASE_URL=postgresql+asyncpg://chat_test:ci-only-password@127.0.0.1:5432/browser_test -e ADMIN_PASSWORD=browser-workshop-admin-1234 chat:ci python -m app.cli admin
      - name: Browser test the exact release image
        env:
          E2E_URL: http://127.0.0.1:9001
        run: |
          export E2E_TARGET_TOKEN=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          docker run -d --name browser-app --network host --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m --tmpfs /tmp:size=64m -v "$PWD/tests:/app/tests:ro" -e DATABASE_URL=postgresql+asyncpg://chat_test:ci-only-password@127.0.0.1:5432/browser_test -e TEST_ALLOW_RESET=browser_test -e E2E_TARGET_TOKEN -e E2E_URL -e E2E_STATIC_DIR=/app/frontend/dist -e E2E_COMMIT_SHA="$GITHUB_SHA" chat:ci uvicorn tests.browser_app:create_app --app-dir /app --factory --host 127.0.0.1 --port 9001
          for attempt in $(seq 1 30); do curl -fsS "$E2E_URL/api/health" && break || sleep 2; done
          uv run playwright install --with-deps chromium
          uv run pytest tests/e2e -v
      - name: Vulnerability gate and SBOM
        run: |
          sh scripts/install-trivy.sh
          .tools/trivy/trivy image --format json --output artifacts/vulnerabilities.json chat:ci
          .tools/trivy/trivy image --format cyclonedx --output artifacts/sbom.json chat:ci
          .tools/trivy/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed chat:ci
      - name: Exact-image two-replica admission and termination faults
        env:
          PROCESS_DATABASE_URL: postgresql+asyncpg://chat_test:ci-only-password@127.0.0.1:5432/process_test
          PROCESS_ALLOW_RESET: process_test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U chat_test -d chat_test -c 'CREATE DATABASE process_test'
          uv run python tests/process/experiment.py --image chat:ci
      - name: Save tested artifact
        run: |
          mkdir -p release
          docker save chat:ci -o release/image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-image
          path: release/image.tar
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-evidence
          path: artifacts/
          retention-days: 90
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: tested-image
          path: release
      - name: Publish the tested image without rebuilding
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker load -i release/image.tar
          test "$(docker image inspect chat:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect chat:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_VERSION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/kaw393939/is373-ai-chat:sha-$GITHUB_SHA"
          docker tag chat:ci "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          python3 deploy/ci_release.py candidate "$digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: published-candidate
          path: candidate.json
          retention-days: 90
  development:
    name: Development preview
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: development
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Require the footer's downloadable immutable book edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/check_book_release.py
      - name: Deploy exact tested preview
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/ssh_release.py deploy dev > dev-deployment.json
      - name: Verify public HTTPS identity
        run: |
          python3 -m pip install uv==0.12.15
          uv sync --frozen --python 3.14.7
          uv run python deploy/check_preview.py dev "$COMMIT" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: development-evidence
          path: dev-*.json
          retention-days: 90
  qa:
    name: QA acceptance
    needs: [publish, development]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: qa
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Deploy and migrate exact tested QA image
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/ssh_release.py deploy qa > qa-deployment.json
      - name: Synthetic QA browser, persistence and HTTPS checks
        env:
          QA_SMOKE_EMAIL: ${{ secrets.QA_SMOKE_EMAIL }}
          QA_SMOKE_PASSWORD: ${{ secrets.QA_SMOKE_PASSWORD }}
        run: |
          python3 -m pip install uv==0.12.15
          uv sync --frozen --python 3.14.7
          uv run playwright install --with-deps chromium
          uv run python deploy/check_preview.py qa "$COMMIT" "$RELEASE_VERSION" --browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: qa-evidence
          path: qa-*.json
          retention-days: 90
  attest:
    name: Record accepted QA candidate
    needs: [publish, qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qa
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
      CANDIDATE_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Bind successful QA job to host artifact
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/ssh_release.py attest qa > qa-attestation.json
          python3 deploy/ci_release.py candidate "$DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: accepted-candidate
          path: |
            candidate.json
            qa-attestation.json
          retention-days: 90
