<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="title desc">
<title id="title">Public application boundaries</title>
<desc id="desc">Browser HTTPS goes through Traefik to FastAPI and the compiled frontend. The app uses PostgreSQL and a provider adapter. A separate host collector supplies a read-only metrics file; the app has no Docker control socket.</desc>
